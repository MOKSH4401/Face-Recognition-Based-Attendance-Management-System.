{% extends 'base.html' %}

{% block title %}Edit Faculty{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-user-edit me-2"></i>Edit Faculty</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="{{ url_for('edit_faculty', id=faculty.id) }}">
                        <div class="mb-3">
                            <label for="faculty_id" class="form-label">Faculty ID</label>
                            <input type="text" class="form-control" id="faculty_id" value="{{ faculty.faculty_id }}" disabled>
                            <small class="text-muted">Faculty ID cannot be changed</small>
                        </div>
                        <div class="mb-3">
                            <label for="faculty_name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="faculty_name" name="faculty_name"
                                   value="{{ faculty.faculty_name }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   value="{{ faculty.email }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone"
                                   value="{{ faculty.phone or '' }}">
                        </div>
                        <div class="mb-3">
                            <label for="department" class="form-label">Department</label>
                            <input type="text" class="form-control" id="department" name="department"
                                   value="{{ faculty.department }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="designation" class="form-label">Designation</label>
                            <input type="text" class="form-control" id="designation" name="designation"
                                   value="{{ faculty.designation }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="password" name="password" minlength="6">
                            <small class="text-muted">Leave blank to keep the current password</small>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Assigned Courses</label>
                            <div class="border p-3 rounded">
                                {% if courses %}
                                    {% for course in courses %}
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="course_ids"
                                               value="{{ course.id }}" id="course_{{ course.id }}"
                                               {% if course.id in assigned_course_ids %}checked{% endif %}>
                                        <label class="form-check-label" for="course_{{ course.id }}">
                                            {{ course.name }} ({{ course.course_id }})
                                        </label>
                                    </div>
                                    {% endfor %}
                                {% else %}
                                    <p class="text-muted mb-0">No courses available.</p>
                                {% endif %}
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('faculty_list') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i> Back
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Update Faculty
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
