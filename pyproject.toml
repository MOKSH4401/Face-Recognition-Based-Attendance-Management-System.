[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "AttendSys PIN + GPS attendance"
requires-python = ">=3.11"
dependencies = [
    "flask>=2.2.3",
    "werkzeug>=2.2.3",
    "flask-login>=0.6.2",
    "flask-sqlalchemy>=3.0.3",
    "sqlalchemy>=2.0.9",
    "psycopg2-binary>=2.9.5",
    "flask-socketio>=5.3.6",
    "python-socketio>=5.11.2",
    "python-engineio>=4.9.1",
    "python-dotenv>=1.0.0",
    "email-validator>=1.3.1",
    "flask-mail>=0.9.1",
    "bcrypt>=4.0.1",
    "openpyxl>=3.1.2",
    "reportlab>=4.0.4",
    "pandas>=2.1.0",
    "pymysql>=1.1.1",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
]
